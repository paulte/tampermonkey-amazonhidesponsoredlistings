repos:
  - repo: local
    hooks:
      - id: format
        name: Prettier
        entry: npm run format
        language: system
        pass_filenames: false

      - id: lint
        name: ESLint
        entry: npm run lint
        language: system
        pass_filenames: false

  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell

  - repo: local
    hooks:
      - id: actionlint
        name: GitHub Actions
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
